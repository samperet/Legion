<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .sw { border: 1px solid var(--alps-slate-line); border-radius: 4px; overflow: hidden; background: #fff; }
  .chip { height: 80px; }
  .lbl { padding: 10px 12px 12px; }
  .lbl .name { font-weight: 600; color: var(--alps-navy); font-size: 11px;}
  .lbl .hex  { font-size: 10px; color: var(--fg-3); margin-top: 2px; font-variant-numeric: tabular-nums;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FAFAF8"></div><div class="lbl"><div class="name">Page</div><div class="hex">#FAFAF8</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF; border-bottom: 1px solid #eee;"></div><div class="lbl"><div class="name">Card</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:#E8EDF1"></div><div class="lbl"><div class="name">Fog</div><div class="hex">#E8EDF1</div></div></div>
    <div class="sw"><div class="chip" style="background:#D7DEE3"></div><div class="lbl"><div class="name">Line</div><div class="hex">#D7DEE3</div></div></div>
    <div class="sw"><div class="chip" style="background:#6F7A7D"></div><div class="lbl"><div class="name">Muted</div><div class="hex">#6F7A7D</div></div></div>
    <div class="sw"><div class="chip" style="background:#0A2540"></div><div class="lbl"><div class="name">Navy Deep</div><div class="hex">#0A2540</div></div></div>
  </div>
</body></html>
