<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 0; margin: 0; background: #0A2540; height: 320px; position: relative; overflow: hidden;}
  .photo { position: absolute; inset: 0; background: url('../assets/hero-alps.png') center 35% / cover no-repeat;}
  .scrim { position: absolute; inset: 0; background:
    linear-gradient(110deg, rgba(10,37,64,0.85) 0%, rgba(10,37,64,0.55) 30%, rgba(10,37,64,0.10) 60%, rgba(10,37,64,0) 100%);
  }
  .inner { position: relative; padding: 36px 40px; color: #fff; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px;}
  .eyebrow { font-size: 11px; color: #7BB8DC; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 500;}
  h1 { color: #fff; font-size: 40px; font-weight: 600; letter-spacing: -0.025em; margin: 0; max-width: 420px; line-height: 1.05; text-wrap: balance; text-shadow: 0 1px 12px rgba(10,37,64,0.4);}
  p { color: rgba(255,255,255,0.85); font-size: 13px; max-width: 380px; margin: 0; line-height: 1.5;}
  .meta { position: absolute; bottom: 14px; left: 40px; right: 40px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.5); border-top: 1px solid rgba(255,255,255,0.18); padding-top: 12px; font-weight: 500;}
</style></head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="inner">
    <span class="eyebrow">Hero photography</span>
    <h1>The summit is rarely reached alone.</h1>
    <p>Aspirational alpine imagery, navy gradient scrim on the left for headline legibility.</p>
  </div>
  <div class="meta"><span>Est. 1985</span><span>Bar Harbor · Boston · New York</span></div>
</body></html>
