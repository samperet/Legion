<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 28px 32px; }
  .ramp { display: grid; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 24px; border-bottom: 1px dashed var(--alps-slate-line); padding-bottom: 12px; }
  .row:last-child { border: 0; }
  .spec { font-size: 11px; color: var(--fg-3); width: 140px; flex: none; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .sample { color: var(--alps-navy); letter-spacing: -0.02em; font-weight: 600; line-height: 1.05; }
</style></head>
<body>
  <div class="ramp">
    <div class="row"><div class="spec">Display · 600 · 64</div><div class="sample" style="font-size: 56px;">Lived experience.</div></div>
    <div class="row"><div class="spec">H1 · 600 · 48</div><div class="sample" style="font-size: 40px;">Strategic counsel</div></div>
    <div class="row"><div class="spec">H2 · 600 · 32</div><div class="sample" style="font-size: 28px;">Succession & transition</div></div>
    <div class="row"><div class="spec">H3 · 600 · 22</div><div class="sample" style="font-size: 20px; letter-spacing: -0.01em;">Practice areas</div></div>
  </div>
</body></html>
