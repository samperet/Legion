<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--surface-page); padding: 32px; display: flex; align-items: center; gap: 32px; }
  .mark { background: #fff; border: 1px solid var(--alps-slate-line); border-radius: 4px; padding: 28px 36px; display: grid; place-items: center; }
  .mark img { display: block; height: 72px; width: auto; }
  .mark.dark { background: var(--alps-navy); }
  .meta { flex: 1; }
  .meta .eyebrow { color: var(--alps-blue); }
  .meta h3 { margin-top: 8px; color: var(--alps-navy); font-size: 22px; }
  .meta p  { margin-top: 6px; font-size: 13px; color: var(--fg-3); }
</style></head>
<body>
  <div class="mark"><img src="../assets/alps-logo.png" alt="ALPS"></div>
  <div class="mark dark"><img src="../assets/alps-logo.png" alt="ALPS" style="filter: brightness(0) invert(1);"></div>
  <div class="meta">
    <span class="eyebrow">Primary mark</span>
    <h3>ALPS wordmark</h3>
    <p>Use on warm off‑white or deep navy. Minimum clear space = cap‑height of the "A". Never recolor the arc or letterforms outside of the two‑tone treatment shown.</p>
  </div>
</body></html>
