<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ALPS · Data</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="slide-base.css" />
<style>
  html, body { margin: 0; padding: 0; background: #103758; overflow: hidden; width: 100vw; height: 100vh;}
  .stage { width: 100vw; height: 100vh; position: relative; overflow: hidden;}
  .scale {
    position: absolute; top: 0; left: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
  }
</style>
<script>
  const fit = () => {
    const el = document.querySelector('.scale');
    if (!el) return;
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const s = Math.min(sx, sy);
    const tx = (window.innerWidth - 1920 * s) / 2;
    const ty = (window.innerHeight - 1080 * s) / 2;
    el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  };
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', fit);
  // also run early in case load timing differs
  setTimeout(fit, 0);
</script>
</head>
<body>
  <div class="stage"><div class="scale"><section class="slide dark">
  <div class="slide__chrome-top">
    <img src="../assets/alps-logo.png" alt="ALPS"/>
    <span class="meta">05 · By the numbers</span>
  </div>
  <div class="slide__body" style="gap: 80px;">
    <div style="max-width: 1400px;">
      <span class="eyebrow">By the numbers</span>
      <h2 style="margin-top: 28px; color: #fff;">Forty years. One operating philosophy.</h2>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 96px; flex: 1; align-content: center;">
      <div style="padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.18);">
        <div style="font-size: 160px; font-weight: 600; color: #fff; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">40<span style="font-size: 60px; color: #2299CE; margin-left: 8px; font-weight: 500;">+</span></div>
        <p style="margin-top: 24px; font-size: 22px; color: rgba(255,255,255,0.7); line-height: 1.5; max-width: 360px;">Years of operating experience among partners.</p>
      </div>
      <div style="padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.18);">
        <div style="font-size: 160px; font-weight: 600; color: #fff; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">120</div>
        <p style="margin-top: 24px; font-size: 22px; color: rgba(255,255,255,0.7); line-height: 1.5; max-width: 360px;">Engagements completed since 1985, each held in confidence.</p>
      </div>
      <div style="padding-top: 32px; border-top: 1px solid rgba(255,255,255,0.18);">
        <div style="font-size: 160px; font-weight: 600; color: #fff; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">3</div>
        <p style="margin-top: 24px; font-size: 22px; color: rgba(255,255,255,0.7); line-height: 1.5; max-width: 360px;">Offices &mdash; Bar Harbor, Boston, New York.</p>
      </div>
    </div>
  </div>
  <div class="slide__chrome-bottom"><span>Firm data</span><span>05</span><span>Confidential</span></div>
</section></div></div>
</body>
</html>
